# Render Blueprint for the API. Secrets are entered in the Render dashboard (sync: false).
services:
  - type: web
    name: cyberspark-api
    runtime: node
    rootDir: backend
    plan: free              # change to a paid plan to avoid cold starts after idle periods
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CORS_ORIGINS
        value: https://cybersparkit.site,https://www.cybersparkit.site
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: NOTIFY_EMAIL
        value: cybersparkit@gmail.com
      - key: N8N_WEBHOOK_URL
        sync: false
      - key: N8N_WEBHOOK_SECRET
        sync: false
      - key: AUTOMATION_API_KEY
        sync: false
